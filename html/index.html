<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="frontend.css">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class='navbar'>
        <a href="index.html">Home</a>
        <a href="yourpurchases.html">Your Purchases</a>
    </div>
    <div class="buttons">
        <h1>Hey,glad you are here!</h1>
        <button class="classic_button">Sign Up</button>
        <button class="classic_button">Sign In</button>
    </div>
    <h2 style="text-align:center;position:relative;">Choose your friend</h2>
    <div class="container">
        <div class="card">
            <div class="circle" data-friend="dog"><i class="fa-solid fa-dog icon_dog"></i></div>
             <span class="circle_dog">Dog</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="cat"><i class="fa-solid fa-cat icon_cat"></i></div>
             <span class="circle_cat">Cat</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="bird"><i class="fa-solid fa-dove icon_bird"></i></div>
             <span class="circle_bird">Bird</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="fish"><i class="fa-solid fa-fish icon_fish"></i></div>
             <span class="circle_fish">Fish</span>
        </div>
    </div>
<button class="classic_button" >Choose</button>
<script src="main.js"></script>
</body>
</html>
