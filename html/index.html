        <button class="classic_button">Sign Up</button>

    <h2 style="text-align:center;position:relative;">Choose your friend</h2>
    <div class="container">
        <div class="card">
            <div class="circle" data-friend="dog"><i class="fa-solid fa-dog icon_dog"></i></div>
             <span class="circle_dog">Dog</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="cat"><i class="fa-solid fa-cat icon_cat"></i></div>
             <span class="circle_cat">Cat</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="bird"><i class="fa-solid fa-dove icon_bird"></i></div>
             <span class="circle_bird">Bird</span>
        </div>
        <div class="card">
            <div class="circle" data-friend="fish"><i class="fa-solid fa-fish icon_fish"></i></div>
             <span class="circle_fish">Fish</span>
        </div>
    </div>
<button class="classic_button" id="openForm" disabled>Choose</button>

<!--Form for the chosen pet-->
<div class="pet_form" id="petForm">
    <header>A few words about your pet</header>
    <input type="text" placeholder="Name">
    <input type="number" placeholder="Age">
    <input type="text" placeholder="Breed">
    <input type="text" placeholder="Preferred activity">
    <button class="classic_button">Submit</button>
</div>
